<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>

    body{
      margin:0;
      padding:0;
      background:#111;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family:Arial;
    }

    .box{
      width:350px;
      background:#1e1e1e;
      padding:30px;
      border-radius:15px;
    }

    h1{
      color:gold;
      text-align:center;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:15px;
      margin-bottom:15px;
      border:none;
      border-radius:10px;
      background:#333;
      color:white;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:gold;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Login</h1>

    <form id="loginForm">

      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

  </div>

  <script src="app.js"></script>

</body>

</html>
