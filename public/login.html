<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="auth-wrapper">

    <div class="auth-box">

      <img
        src="logo.png"
        class="auth-logo"
      >

      <h1>Login</h1>

      <form id="loginForm">

        <input
          type="email"
          id="email"
          placeholder="Email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <a href="register.html">
        Create Account
      </a>

    </div>

  </div>

  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", async(e)=>{

        e.preventDefault();

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const response =
          await fetch("/login", {

            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify({
              email,
              password
            })

          });

        const data =
          await response.json();

        if(data.success){

          localStorage.setItem(
            "token",
            data.token
          );

          window.location.href =
            "dashboard.html";

        } else {

          alert(
            data.message ||
            "Login Failed"
          );

        }

      });

  </script>

</body>

</html>
