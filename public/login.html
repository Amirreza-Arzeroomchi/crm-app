<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="manifest" href="/manifest.json">

  <link rel="apple-touch-icon" href="/icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>

    body{
      margin:0;
      padding:0;
      background:#111;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family:Arial;
    }

    .box{
      width:350px;
      background:#1e1e1e;
      padding:30px;
      border-radius:15px;
    }

    h1{
      color:gold;
      text-align:center;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:15px;
      margin-bottom:15px;
      border:none;
      border-radius:10px;
      background:#333;
      color:white;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:gold;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    .register-text{
      margin-top:20px;
      text-align:center;
      color:white;
    }

    .register-text a{
      color:gold;
      text-decoration:none;
      font-weight:bold;
    }

  </style>

</head>
