<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="auth-wrapper">

    <div class="auth-box">

      <img
        src="logo.png"
        class="auth-logo"
      >

      <h1>Create Account</h1>

      <form id="registerForm">

        <input
          type="text"
          id="name"
          placeholder="Name"
          required
        >

        <input
          type="email"
          id="email"
          placeholder="Email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Register
        </button>

      </form>

      <a href="login.html">
        Back To Login
      </a>

    </div>

  </div>

  <script>

    document
      .getElementById("registerForm")
      .addEventListener("submit", async(e)=>{

        e.preventDefault();

        const name =
          document.getElementById("name").value;

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const response =
          await fetch("/register", {

            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify({
              name,
              email,
              password
            })

          });

        const data =
          await response.json();

        if(data.success){

          alert("Account Created");

          window.location.href =
            "login.html";

        } else {

          alert(
            data.message ||
            "Register Failed"
          );

        }

      });

  </script>

</body>

</html>
