<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Register</title>

  <link rel="stylesheet" href="style.css"/>

</head>

<body>

  <div class="auth-container">

    <img
      src="logo.png"
      class="logo"
    />

    <h1>Create Account</h1>

    <form id="registerForm">

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      />

      <button type="submit">
        Register
      </button>

    </form>

    <a href="login.html">
      Back To Login
    </a>

  </div>

  <script>

    const registerForm =
      document.getElementById(
        "registerForm"
      );

    registerForm.addEventListener(
      "submit",
      async (e) => {

        e.preventDefault();

        const email =
          document.getElementById(
            "email"
          ).value;

        const password =
          document.getElementById(
            "password"
          ).value;

        try {

          const response =
            await fetch("/register", {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",
              },

              body: JSON.stringify({
                email,
                password,
              }),
            });

          const data =
            await response.json();

          if (data.success) {

            alert(
              "Registered Successfully"
            );

            window.location.href =
              "login.html";

          } else {

            alert(
              data.message
            );

          }

        } catch (err) {

          console.log(err);

          alert("Server Error");

        }

      }
    );

  </script>

</body>
</html>
