<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard</title>

  <link rel="stylesheet" href="style.css"/>

</head>

<body>

  <div class="dashboard-container">

    <div class="top-bar">

      <img
        src="logo.png"
        class="logo"
      />

      <div class="top-buttons">

        <button
          class="add-btn"
          onclick="goToCustomerForm()"
        >
          Add Customer
        </button>

        <button
          class="email-btn"
          onclick="sendGroupEmail()"
        >
          Group Email
        </button>

        <button
          class="print-btn"
          onclick="printCustomers()"
        >
          Print
        </button>

        <button
          class="logout-btn"
          onclick="logout()"
        >
          Sign Out
        </button>

      </div>

    </div>

    <input
      type="text"
      id="searchInput"
      class="search"
      placeholder="Search customers..."
    />

    <table>

      <thead>

        <tr>

          <th>First Name</th>

          <th>Last Name</th>

          <th>Email</th>

          <th>Phone</th>

          <th>City</th>

          <th>Actions</th>

        </tr>

      </thead>

      <tbody id="customerTable"></tbody>

    </table>

    <div
      id="customerDetails"
      class="customer-details"
      style="display:none;"
    ></div>

  </div>

  <script>

    let customers = [];

    async function loadCustomers(){

      try {

        const response =
          await fetch("/customers");

        customers =
          await response.json();

        renderCustomers(customers);

      } catch(err){

        console.log(err);

      }

    }

    function renderCustomers(data){

      const table =
        document.getElementById(
          "customerTable"
        );

      table.innerHTML = "";

      data.forEach(customer => {

        table.innerHTML += `

          <tr>

            <td>
              ${customer.firstName || ""}
            </td>

            <td>
              ${customer.lastName || ""}
            </td>

            <td>
              ${customer.email || ""}
            </td>

            <td>
              ${customer.phone || ""}
            </td>

            <td>
              ${customer.city || ""}
            </td>

            <td>

              <button
                class="action-btn view-btn"
                onclick="viewCustomer('${customer._id}')"
              >
                View
              </button>

              <button
                class="action-btn delete-btn"
                onclick="deleteCustomer('${customer._id}')"
              >
                Delete
              </button>

            </td>

          </tr>

        `;

      });

    }

    function viewCustomer(id){

      const customer =
        customers.find(
          c => c._id === id
        );

      if(!customer) return;

      let mediaHTML = "";

      if(customer.media){

        const file =
          customer.media
          .toLowerCase();

        if(

          file.endsWith(".jpg")
          ||
          file.endsWith(".jpeg")
          ||
          file.endsWith(".png")
          ||
          file.endsWith(".webp")

        ){

          mediaHTML = `

            <img
              src="${customer.media}"
              style="
                width:300px;
                margin-top:20px;
                border-radius:15px;
              "
            />

          `;

        }

        else if(

          file.endsWith(".mp4")

        ){

          mediaHTML = `

            <video
              controls
              style="
                width:400px;
                margin-top:20px;
                border-radius:15px;
              "
            >

              <source
                src="${customer.media}"
              >

            </video>

          `;

        }

        else {

          mediaHTML = `

            <a
              href="${customer.media}"
              target="_blank"
              class="file-link"
            >
              Open Attached File
            </a>

          `;

        }

      }

      const details =
        document.getElementById(
          "customerDetails"
        );

      details.innerHTML = `

        <h2>

          ${customer.firstName}
          ${customer.lastName}

        </h2>

        <p>

          <b>Phone:</b>
          ${customer.phone}

        </p>

        <p>

          <b>Email:</b>
          ${customer.email}

        </p>

        <p>

          <b>Address:</b>
          ${customer.address}

        </p>

        <p>

          <b>City:</b>
          ${customer.city}

        </p>

        <p>

          <b>Description:</b>
          ${customer.description}

        </p>

        ${mediaHTML}

        <br><br>

        <button
          class="email-btn"
          onclick="sendSingleEmail('${customer.email}')"
        >
          Send Email
        </button>

      `;

      details.style.display =
        "block";

      details.scrollIntoView({

        behavior:"smooth"

      });

    }

    async function deleteCustomer(id){

      const confirmDelete =
        confirm(
          "Delete customer?"
        );

      if(!confirmDelete) return;

      await fetch(

        "/delete-customer/" + id,

        {
          method:"DELETE"
        }

      );

      loadCustomers();

      document
        .getElementById(
          "customerDetails"
        )
        .style.display = "none";

    }

    async function sendSingleEmail(email){

      const subject =
        prompt("Email Subject");

      const text =
        prompt("Email Message");

      if(!subject || !text) return;

      const response =
        await fetch("/send-email", {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            to:email,
            subject,
            text

          })

        });

      const data =
        await response.json();

      if(data.success){

        alert("Email Sent");

      } else {

        alert("Email Error");

      }

    }

    async function sendGroupEmail(){

      const subject =
        prompt("Email Subject");

      const text =
        prompt("Email Message");

      if(!subject || !text) return;

      const emails =
        customers
        .map(c => c.email)
        .join(",");

      const response =
        await fetch("/send-email", {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            to:emails,
            subject,
            text

          })

        });

      const data =
        await response.json();

      if(data.success){

        alert("Emails Sent");

      } else {

        alert("Email Error");

      }

    }

    function printCustomers(){

      window.print();

    }

    function logout(){

      localStorage.clear();

      window.location.href =
        "login.html";

    }

    function goToCustomerForm(){

      window.location.href =
        "customer.html";

    }

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "keyup",
        function(){

          const value =
            this.value
            .toLowerCase();

          const filtered =
            customers.filter(c => {

              return (

                c.firstName
                ?.toLowerCase()
                .includes(value)

                ||

                c.lastName
                ?.toLowerCase()
                .includes(value)

                ||

                c.email
                ?.toLowerCase()
                .includes(value)

                ||

                c.phone
                ?.toLowerCase()
                .includes(value)

              );

            });

          renderCustomers(filtered);

        }
      );

    loadCustomers();

  </script>

</body>

</html>
