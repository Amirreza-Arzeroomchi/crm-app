<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI,sans-serif;
}

body{
  background:
    radial-gradient(circle at top,#1a1a1a,#050505);

  min-height:100vh;
  padding:40px;
  color:white;
}

/* ================= CONTAINER ================= */

.dashboard-container{
  max-width:1400px;
  margin:auto;
}

/* ================= LOGO ================= */

.logo-box{
  display:flex;
  justify-content:center;
  margin-bottom:40px;
}

.logo-box img{
  width:520px;
  max-width:100%;
  object-fit:contain;

  filter:
    drop-shadow(0 0 10px rgba(255,204,0,.35))
    drop-shadow(0 0 30px rgba(255,204,0,.15));
}

/* ================= TOP BAR ================= */

.top-bar{
  display:flex;
  gap:20px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

#search{
  flex:1;
  min-width:300px;

  height:55px;

  border:none;
  outline:none;

  border-radius:16px;

  padding:0 18px;

  background:#1f1f1f;
  color:white;

  font-size:15px;
}

#search::placeholder{
  color:#777;
}

.send-btn{
  border:none;
  height:55px;

  padding:0 28px;

  border-radius:16px;

  background:
    linear-gradient(135deg,#ffcc00,#ffae00);

  color:black;
  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.send-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(255,204,0,.25);
}

/* ================= TABLE ================= */

.table-card{
  background:rgba(18,18,18,.95);

  border-radius:24px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.05);

  box-shadow:
    0 0 40px rgba(0,0,0,.45),
    0 0 40px rgba(255,204,0,.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:
    linear-gradient(90deg,#ffcc00,#ffae00);
}

thead th{
  color:black;
  padding:22px 18px;
  text-align:left;
  font-size:14px;
}

tbody tr{
  border-bottom:1px solid rgba(255,255,255,.05);

  transition:.25s;

  cursor:pointer;
}

tbody tr:hover{
  background:rgba(255,204,0,.04);
}

tbody td{
  padding:22px 18px;
  color:#f1f1f1;
  font-size:14px;
}

/* ================= BUTTONS ================= */

.action-group{
  display:flex;
  gap:10px;
}

.email-btn,
.delete-btn{
  border:none;

  padding:10px 15px;

  border-radius:12px;

  font-size:13px;
  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.email-btn{
  background:#ffcc00;
  color:black;
}

.email-btn:hover{
  background:#ffb300;
}

.delete-btn{
  background:#2d2d2d;
  color:white;
}

.delete-btn:hover{
  background:#ff2d2d;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.7);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:999;
}

.modal-content{

  width:500px;
  max-width:95%;

  background:#181818;

  border-radius:24px;

  padding:35px;

  border:1px solid rgba(255,204,0,.15);

  box-shadow:
    0 0 50px rgba(255,204,0,.08);

  animation:fade .25s ease;
}

.modal-content h2{
  color:#ffcc00;
  margin-bottom:25px;
}

.info{
  margin-bottom:16px;
  line-height:1.6;
}

.label{
  color:#ffcc00;
  font-weight:700;
}

.close-btn{

  width:100%;
  height:52px;

  border:none;
  border-radius:14px;

  margin-top:20px;

  background:
    linear-gradient(135deg,#ffcc00,#ffae00);

  color:black;
  font-weight:700;

  cursor:pointer;
}

@keyframes fade{
  from{
    opacity:0;
    transform:scale(.95);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

</style>
</head>

<body>
  <button onclick="logout()" class="logout-btn">
  Logout
</button>

<div class="dashboard-container">

  <!-- LOGO -->
  <div class="logo-box">
    <img src="logo.png">
  </div>

  <!-- SEARCH -->
  <div class="top-bar">

    <input
      type="text"
      id="search"
      placeholder="Search customers..."
    >

    <button class="send-btn">
      Send Email To Selected
    </button>

  </div>

  <!-- TABLE -->
  <div class="table-card">

    <table>

      <thead>
        <tr>
          <th>First</th>
          <th>Last</th>
          <th>Email</th>
          <th>Phone</th>
          <th>City</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="customerTable">
      </tbody>

    </table>

  </div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-content">

    <h2>Customer Details</h2>

    <div class="info">
      <span class="label">First Name:</span>
      <span id="mFirst"></span>
    </div>

    <div class="info">
      <span class="label">Last Name:</span>
      <span id="mLast"></span>
    </div>

    <div class="info">
      <span class="label">Email:</span>
      <span id="mEmail"></span>
    </div>

    <div class="info">
      <span class="label">Phone:</span>
      <span id="mPhone"></span>
    </div>

    <div class="info">
      <span class="label">Address:</span>
      <span id="mAddress"></span>
    </div>

    <div class="info">
      <span class="label">City:</span>
      <span id="mCity"></span>
    </div>

    <div class="info">
      <span class="label">Description:</span>
      <span id="mDescription"></span>
    </div>

    <button class="close-btn" onclick="closeModal()">
      Close
    </button>

  </div>

</div>

<script>

let allCustomers = [];

async function loadCustomers(){

  const response = await fetch("/customers");

  const customers = await response.json();

  allCustomers = customers;

  renderCustomers(customers);
}

function renderCustomers(customers){

  const table = document.getElementById("customerTable");

  table.innerHTML = "";

  customers.forEach((customer,index)=>{

    table.innerHTML += `

      <tr onclick="showCustomer(${index})">

        <td>${customer.firstName || ""}</td>
        <td>${customer.lastName || ""}</td>
        <td>${customer.email || ""}</td>
        <td>${customer.phone || ""}</td>
        <td>${customer.city || ""}</td>

        <td>

          <div class="action-group">

            <button
              class="email-btn"
              onclick="event.stopPropagation(); window.location.href='mailto:${customer.email}'"
            >
              Email
            </button>

            <button
              class="delete-btn"
              onclick="event.stopPropagation(); deleteCustomer(${index})"
            >
              Delete
            </button>

          </div>

        </td>

      </tr>

    `;
  });

}

/* ================= MODAL ================= */

function showCustomer(index){

  const c = allCustomers[index];

  document.getElementById("mFirst").innerText =
    c.firstName || "";

  document.getElementById("mLast").innerText =
    c.lastName || "";

  document.getElementById("mEmail").innerText =
    c.email || "";

  document.getElementById("mPhone").innerText =
    c.phone || "";

  document.getElementById("mAddress").innerText =
    c.address || "";

  document.getElementById("mCity").innerText =
    c.city || "";

  document.getElementById("mDescription").innerText =
    c.description || "";

  document.getElementById("modal").style.display =
    "flex";
}

function closeModal(){

  document.getElementById("modal").style.display =
    "none";
}
// close modal when clicking outside

window.onclick = function(e){

  const modal =
    document.getElementById("modal");

  if(e.target === modal){

    modal.style.display = "none";
  }
}

/* ================= DELETE ================= */

async function deleteCustomer(index){

  await fetch("/delete/" + index,{
    method:"DELETE"
  });

  loadCustomers();
}

/* ================= SEARCH ================= */

document
.getElementById("search")
.addEventListener("input",(e)=>{

  const value =
    e.target.value.toLowerCase();

  const filtered =
    allCustomers.filter(c =>

      (c.firstName || "")
      .toLowerCase()
      .includes(value)

      ||

      (c.lastName || "")
      .toLowerCase()
      .includes(value)

      ||

      (c.email || "")
      .toLowerCase()
      .includes(value)

    );

  renderCustomers(filtered);
});

loadCustomers();
/* ================= LOGOUT ================= */

function logout(){

  localStorage.removeItem("token");

  window.location.href = "/login.html";

}
</script>

<!-- Removed duplicate modal with id="customerModal" to avoid confusion and errors. -->
</body>
</html>
