<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard</title>

  <style>

    * {

      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;

    }

    body {

      background: #111;
      color: white;
      padding: 30px;

    }

    .top-bar {

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 30px;

    }

    .logo {

      width: 420px;
      max-width: 100%;

    }

    .logout-btn {

      background: gold;
      color: black;

      border: none;

      padding: 14px 24px;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }

    .search-box {

      margin-bottom: 25px;

    }

    .search-box input {

      width: 100%;

      padding: 18px;

      border: none;

      border-radius: 14px;

      background: #222;

      color: white;

      font-size: 18px;

      outline: none;

    }

    table {

      width: 100%;

      border-collapse: collapse;

      overflow: hidden;

      border-radius: 20px;

    }

    thead {

      background: gold;
      color: black;

    }

    th,
    td {

      padding: 20px;

      text-align: left;

    }

    tbody tr {

      background: #1d1d1d;

      border-bottom:
        1px solid #333;

    }

    tbody tr:hover {

      background: #2b2b2b;

    }

    .action-btn {

      border: none;

      padding: 10px 18px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: bold;

      margin-right: 10px;

    }

    .view-btn {

      background: gold;
      color: black;

    }

    .delete-btn {

      background: #ff4040;
      color: white;

    }

    .add-btn {

      display: inline-block;

      margin-top: 25px;

      background: gold;

      color: black;

      padding: 16px 24px;

      border-radius: 14px;

      text-decoration: none;

      font-size: 20px;

      font-weight: bold;

    }

    .details-box {

      display: none;

      margin-top: 35px;

      background: #1b1b1b;

      padding: 35px;

      border-radius: 22px;

    }

    .details-box h2 {

      color: gold;

      margin-bottom: 20px;

      font-size: 36px;

    }

    .details-box p {

      margin-bottom: 14px;

      font-size: 18px;

    }

    .media-grid {

      margin-top: 25px;

      display: flex;
      flex-wrap: wrap;

      gap: 20px;

    }

    .media-grid img {

      width: 240px;

      border-radius: 14px;

    }

    .media-grid video {

      width: 320px;

      border-radius: 14px;

    }

    .file-link {

      display: inline-block;

      background: gold;

      color: black;

      text-decoration: none;

      padding: 12px 18px;

      border-radius: 12px;

      font-weight: bold;

    }

    @media (max-width: 768px) {

      body {

        padding: 15px;

      }

      th,
      td {

        padding: 12px;

        font-size: 14px;

      }

      .details-box {

        padding: 20px;

      }

    }

  </style>

</head>

<body>

  <div class="top-bar">

    <img
      src="logo.png"
      class="logo"
    />

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Search customers..."
      onkeyup="searchCustomers()"
    />

  </div>

  <table>

    <thead>

      <tr>

        <th>First Name</th>

        <th>Last Name</th>

        <th>Email</th>

        <th>Phone</th>

        <th>City</th>

        <th>Actions</th>

      </tr>

    </thead>

    <tbody id="customerTable"></tbody>

  </table>

  <a
    href="/customer.html"
    class="add-btn"
  >
    + Add Customer
  </a>

  <div
    class="details-box"
    id="customerDetails"
  ></div>

  <script>

    let customers = [];

    async function loadCustomers() {

      try {

        const response =
          await fetch("/customers");

        customers =
          await response.json();

        renderCustomers(customers);

      } catch (err) {

        console.log(err);

      }

    }

    function renderCustomers(data) {

      const table =
        document.getElementById(
          "customerTable"
        );

      table.innerHTML = "";

      data.forEach(customer => {

        const row =
          document.createElement("tr");

        row.innerHTML = `

          <td>${customer.firstName || ""}</td>

          <td>${customer.lastName || ""}</td>

          <td>${customer.email || ""}</td>

          <td>${customer.phone || ""}</td>

          <td>${customer.city || ""}</td>

          <td>

            <button
              class="action-btn view-btn"
              onclick="viewCustomer('${customer._id}')"
            >
              View
            </button>

            <button
              class="action-btn delete-btn"
              onclick="deleteCustomer('${customer._id}')"
            >
              Delete
            </button>

          </td>

        `;

        table.appendChild(row);

      });

    }

    function viewCustomer(id) {

  const customer =
    customers.find(
      c => c._id === id
    );

  if (!customer) return;

  let mediaHTML = "";

  if (
    customer.media &&
    customer.media.length > 0
  ) {

    customer.media.forEach(file => {

      const lower =
        file.toLowerCase();

      if (

        lower.endsWith(".jpg") ||
        lower.endsWith(".jpeg") ||
        lower.endsWith(".png") ||
        lower.endsWith(".webp") ||
        lower.endsWith(".gif")

      ) {

        mediaHTML += `

          <a
            href="${file}"
            target="_blank"
          >

            <img
              src="${file}"
              style="
                width:220px;
                margin-top:15px;
                margin-right:10px;
                border-radius:12px;
                cursor:pointer;
                border:2px solid #ffe100;
              "
            />

          </a>

        `;

      }

      else if (

        lower.endsWith(".mp4") ||
        lower.endsWith(".mov") ||
        lower.endsWith(".webm")

      ) {

        mediaHTML += `

          <video
            controls
            style="
              width:350px;
              margin-top:15px;
              border-radius:12px;
            "
          >

            <source src="${file}" />

          </video>

        `;

      }

      else {

        mediaHTML += `

          <div style="margin-top:15px;">

            <a
              href="${file}"
              target="_blank"
              class="file-link"
              style="
                background:#ffe100;
                color:#000;
                padding:12px 18px;
                border-radius:10px;
                text-decoration:none;
                font-weight:bold;
                display:inline-block;
              "
            >
              Open Attached File
            </a>

          </div>

        `;

      }

    });

  }

  const details =
    document.getElementById(
      "customerDetails"
    );

  details.innerHTML = `

    <h2>

      ${customer.firstName || ""}
      ${customer.lastName || ""}

    </h2>

    <p>
      <b>Phone:</b>
      ${customer.phone || ""}
    </p>

    <p>
      <b>Email:</b>
      ${customer.email || ""}
    </p>

    <p>
      <b>Address:</b>
      ${customer.address || ""}
    </p>

    <p>
      <b>City:</b>
      ${customer.city || ""}
    </p>

    <p>
      <b>Description:</b>
      ${customer.description || ""}
    </p>

    <div
      style="
        display:flex;
        flex-wrap:wrap;
        gap:15px;
        margin-top:20px;
      "
    >

      ${mediaHTML}

    </div>

    <br>

    <button
      class="email-btn"
      onclick="sendSingleEmail('${customer.email}')"
    >
      Send Email
    </button>

  `;

  details.style.display =
    "block";

  details.scrollIntoView({

    behavior: "smooth"

  });

}
      const details =
        document.getElementById(
          "customerDetails"
        );

      details.innerHTML = `

        <h2>
          ${customer.firstName}
          ${customer.lastName}
        </h2>

        <p>
          <b>Phone:</b>
          ${customer.phone || ""}
        </p>

        <p>
          <b>Email:</b>
          ${customer.email || ""}
        </p>

        <p>
          <b>Address:</b>
          ${customer.address || ""}
        </p>

        <p>
          <b>City:</b>
          ${customer.city || ""}
        </p>

        <p>
          <b>Description:</b>
          ${customer.description || ""}
        </p>

        <div class="media-grid">

          ${mediaHTML}

        </div>

      `;

      details.style.display = "block";

      details.scrollIntoView({

        behavior: "smooth"

      });

    }

    async function deleteCustomer(id) {

      const confirmDelete =
        confirm(
          "Delete customer?"
        );

      if (!confirmDelete) return;

      await fetch(

        "/delete-customer/" + id,

        {
          method: "DELETE"
        }

      );

      loadCustomers();

      document.getElementById(
        "customerDetails"
      ).style.display = "none";

    }

    function searchCustomers() {

      const value =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .toLowerCase();

      const filtered =
        customers.filter(customer => {

          return (

            customer.firstName
              ?.toLowerCase()
              .includes(value)

            ||

            customer.lastName
              ?.toLowerCase()
              .includes(value)

            ||

            customer.email
              ?.toLowerCase()
              .includes(value)

            ||

            customer.phone
              ?.toLowerCase()
              .includes(value)

            ||

            customer.city
              ?.toLowerCase()
              .includes(value)

          );

        });

      renderCustomers(filtered);

    }

    function logout() {

      window.location.href =
        "/login.html";

    }

    loadCustomers();

  </script>

</body>

</html>
