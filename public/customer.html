<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- LOGO ONLY -->
    <div class="logo-container">
      <img src="logo.png" class="logo" alt="Company Logo" onerror="this.onerror=null;this.src='default-logo.png';" />
    </div>

    <form id="customerForm">

      <label for="firstName">First Name *</label>
      <input type="text" id="firstName" placeholder="First Name *" required>

      <label for="lastName">Last Name *</label>
      <input type="text" id="lastName" placeholder="Last Name *" required>

      <label for="phone">Phone *</label>
      <input type="text" id="phone" placeholder="Phone *" required>

      <label for="email">Email *</label>
      <input type="email" id="email" placeholder="Email *" required>

      <label for="address">Address (optional)</label>
      <input type="text" id="address" placeholder="Address (optional)">

      <label for="city">City *</label>
      <input type="text" id="city" placeholder="City *" required>

      <textarea id="description" placeholder="Description / Request"></textarea>

      <button type="submit">Save</button>

    </form>

    <a href="dashboard.html">Go to Dashboard</a>

  </div>

  <script src="app.js"></script>

</body>
</html>
