<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#111;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
    }

    .container{
      width:100%;
      max-width:900px;
      background:#1b1b1b;
      padding:40px;
      border-radius:25px;
      border:2px solid #222;
    }

    h1{
      color:#f5d000;
      margin-bottom:30px;
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    input, textarea{
      width:100%;
      padding:18px;
      border:none;
      border-radius:14px;
      background:#5d6068;
      color:white;
      font-size:18px;
    }

    textarea{
      margin-top:20px;
      resize:none;
      height:180px;
    }

    .file-box{
      margin-top:20px;
      background:#222;
      padding:20px;
      border-radius:14px;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:18px;
      border:none;
      border-radius:14px;
      background:#f5d000;
      color:black;
      font-size:24px;
      font-weight:bold;
      cursor:pointer;
    }

    a{
      color:#f5d000;
      text-decoration:none;
      display:block;
      margin-top:20px;
      text-align:center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Add Customer</h1>

    <form id="customerForm">

      <div class="grid">

        <input
          type="text"
          name="firstName"
          placeholder="First Name"
          required
        />

        <input
          type="text"
          name="lastName"
          placeholder="Last Name"
          required
        />

        <input
          type="text"
          name="phone"
          placeholder="Phone"
          required
        />

        <input
          type="email"
          name="email"
          placeholder="Email"
          required
        />

        <input
          type="text"
          name="address"
          placeholder="Address"
        />

        <input
          type="text"
          name="city"
          placeholder="City"
        />

      </div>

      <textarea
        name="description"
        placeholder="Description"
      ></textarea>

      <div class="file-box">

        <p style="margin-bottom:10px;">
          + Add Media / PDF / Images / Videos
        </p>

        <input
          type="file"
          name="media"
        />

      </div>

      <button type="submit">
        Save Customer
      </button>

    </form>

    <a href="dashboard.html">
      Dashboard
    </a>

  </div>

  <script>

    const form = document.getElementById("customerForm");

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      try {

        const formData = new FormData(form);

        const response = await fetch(
          "/save-customer",
          {
            method: "POST",
            body: formData
          }
        );

        const data = await response.json();

        if(data.success){

          alert("Customer Saved Successfully");

          window.location.href = "/dashboard.html";

        }else{

          alert(data.message || "Save Error");

        }

      } catch(err){

        console.log(err);

        alert("Server Error");

      }

    });

  </script>

</body>
</html>
