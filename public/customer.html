<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Customer Form</title>

  <style>

    * {

      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;

    }

    body {

      background: #111;
      color: white;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 20px;

    }

    .container {

      width: 100%;
      max-width: 950px;

      background: #1b1b1b;

      padding: 40px;

      border-radius: 25px;

      box-shadow:
        0 0 25px rgba(255, 215, 0, 0.15);

    }

    .logo {

      text-align: center;

      margin-bottom: 35px;

    }

    .logo img {

      width: 100%;
      max-width: 500px;

    }

    h1 {

      color: gold;

      margin-bottom: 30px;

      text-align: center;

      font-size: 42px;

    }

    form {

      display: flex;
      flex-direction: column;
      gap: 20px;

    }

    .grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 20px;

    }

    input,
    textarea {

      width: 100%;

      padding: 18px;

      border: none;

      border-radius: 14px;

      background: #6f727a;

      color: white;

      font-size: 18px;

      outline: none;

    }

    textarea {

      min-height: 160px;

      resize: vertical;

    }

    input::placeholder,
    textarea::placeholder {

      color: #ddd;

    }

    .upload-box {

      background: #202020;

      padding: 20px;

      border-radius: 16px;

    }

    .upload-title {

      margin-bottom: 15px;

      color: #aaa;

      font-size: 18px;

    }

    input[type="file"] {

      background: transparent;
      padding: 0;

    }

    button {

      border: none;

      background: gold;

      color: black;

      font-size: 24px;

      font-weight: bold;

      padding: 18px;

      border-radius: 14px;

      cursor: pointer;

      transition: 0.3s;

    }

    button:hover {

      opacity: 0.85;

    }

    .dashboard-link {

      text-align: center;

      margin-top: 20px;

    }

    .dashboard-link a {

      color: gold;

      text-decoration: none;

      font-size: 18px;

    }

    @media (max-width: 768px) {

      .grid {

        grid-template-columns: 1fr;

      }

      .container {

        padding: 25px;

      }

      h1 {

        font-size: 32px;

      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="logo">

      <img
        src="logo.png"
        alt="Logo"
      />

    </div>

    <h1>Add Customer</h1>

    <form
      id="customerForm"
      enctype="multipart/form-data"
    >

      <div class="grid">

        <input
          type="text"
          name="firstName"
          placeholder="First Name"
          required
        />

        <input
          type="text"
          name="lastName"
          placeholder="Last Name"
          required
        />

        <input
          type="text"
          name="phone"
          placeholder="Phone"
          required
        />

        <input
          type="email"
          name="email"
          placeholder="Email"
          required
        />

        <input
          type="text"
          name="address"
          placeholder="Address"
        />

        <input
          type="text"
          name="city"
          placeholder="City"
        />

      </div>

      <textarea
        name="description"
        placeholder="Description / Request"
      ></textarea>

      <div class="upload-box">

        <div class="upload-title">

          + Add Media / PDF / Images / Videos

        </div>

        <input
          type="file"
          name="media"
          multiple
        />

      </div>

      <button type="submit">

        Save Customer

      </button>

    </form>

    <div class="dashboard-link">

      <a href="/dashboard.html">

        Dashboard

      </a>

    </div>

  </div>

  <script>

    const form =
      document.getElementById(
        "customerForm"
      );

    form.addEventListener(
      "submit",
      async (e) => {

        e.preventDefault();

        try {

          const formData =
            new FormData(form);

          const response =
            await fetch(
              "/add-customer",
              {

                method: "POST",

                body: formData

              }
            );

          const data =
            await response.json();

          alert(data.message);

          if (
            data.message ===
            "Customer Saved"
          ) {

            window.location.href =
              "/dashboard.html";

          }

        } catch (err) {

          console.log(err);

          alert("Save Error");

        }

      }
    );

  </script>

</body>

</html>
