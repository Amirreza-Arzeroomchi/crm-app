<!DOCTYPE html>
<html lang="en">

<head>
<link rel="manifest" href="/manifest.json">

<link rel="apple-touch-icon" href="/logo.png">
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Customer Form</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="customer-wrapper">

    <div class="customer-box">

      <div class="customer-top">

        <img
          src="logo.png"
          class="auth-logo"
        >

        <button
          class="logout-btn"
          onclick="logout()"
        >
          Sign Out
        </button>

      </div>

      <h1>Add Customer</h1>

      <form id="customerForm">

        <div class="grid-2">

          <input
            type="text"
            name="firstName"
            placeholder="First Name"
            required
          >

          <input
            type="text"
            name="lastName"
            placeholder="Last Name"
            required
          >

          <input
  type="tel"
  name="phone"
  placeholder="Phone"
  pattern="[0-9+\-\s()]{7,20}"
  required
  title="Enter valid phone number"
/>

          <input
  type="email"
  name="email"
  placeholder="Email"
  required
  title="Enter valid email"
/>

          <input
            type="text"
            name="address"
            placeholder="Address"
          >

         <input
  type="text"
  name="city"
  placeholder="City"
  pattern="[A-Za-z\s]{2,}"
  required
  title="Enter valid city name"
/>

        </div>

        <textarea
          name="description"
          placeholder="Description"
        ></textarea>

        <div class="file-upload">

          <p>
            Attach File / Image / PDF / Video
          </p>

          <input
            type="file"
            name="media"
          >

        </div>

        <button type="submit">
          Save Customer
        </button>

      </form>

      <a href="dashboard.html">
        Open Dashboard
      </a>

    </div>

  </div>

  <script>

    function logout(){

      localStorage.clear();

      window.location.href =
        "login.html";

    }

    document
      .getElementById("customerForm")
      .addEventListener("submit", async(e)=>{

        e.preventDefault();

        const form =
          document.getElementById(
            "customerForm"
          );

        const formData =
          new FormData(form);

        const response =
          await fetch("/save-customer", {

            method:"POST",

            body:formData

          });

        const data =
          await response.json();

        if(data.success){

          alert("Customer Saved");

          form.reset();

        } else {

          alert("Save Error");

        }

      });

  </script>

</body>

</html>
